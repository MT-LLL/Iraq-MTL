name: MEED One-Opportunity GPT Analysis Writeback
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/meed-opportunity-analysis-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  write-one-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read production record, write one analysis, and verify readback
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CF_ACCESS_CLIENT_ID"
          test -n "$CF_ACCESS_CLIENT_SECRET"
          node --input-type=module <<'NODE'
          const endpoint = 'https://iraq-mtl.lihui9329.workers.dev/api/admin-opportunity-analysis';
          const headers = {
            'CF-Access-Client-Id': process.env.CF_ACCESS_CLIENT_ID,
            'CF-Access-Client-Secret': process.env.CF_ACCESS_CLIENT_SECRET
          };
          const id = 'MEED-IQ-20855';
          const get = await fetch(endpoint + '?priority=P0%2CP1%2CP2&limit=200', {
            headers, signal: AbortSignal.timeout(30000)
          });
          console.log('Production D1 read HTTP status:', get.status);
          if (!get.ok) throw new Error('Production read failed; response body suppressed.');
          const data = await get.json();
          const row = (data.opportunities || []).find(x => x.id === id);
          if (!row) throw new Error('Target opportunity not found in production D1.');
          const parseObject = value => {
            try {
              const parsed = typeof value === 'string' ? JSON.parse(value || '{}') : value;
              return parsed && typeof parsed === 'object' && !Array.isArray(parsed) ? parsed : {};
            } catch { return {}; }
          };
          const existing = parseObject(row.solutionMatches).opportunityAnalysis;
          if (existing?.promptVersion === 'meed-scope-fit-v1') {
            console.log('Target already has this analysis version; no duplicate write performed.');
            console.log(JSON.stringify({ result: 'already-present', opportunityId: id, readbackVerified: true }));
            process.exit(0);
          }

          const analysis = {
            promptVersion: 'meed-scope-fit-v1',
            analyzedAt: new Date().toISOString(),
            priority: 'P2',
            demandSummary: '项目主体是铁路线路与相关基础设施建设。基于当前记录，潜在 ICT 需求可能涉及铁路沿线通信承载、站点网络、视频监控回传及配套数据中心/云资源；这些属于待业主范围确认的机会假设，不是已确认招标范围。',
            recommendedHuaweiSolutions: [
              '光传输与 IP 承载网络：用于评估沿线及站点之间的通信承载需求',
              '企业网络与无线覆盖：用于评估车站、运维设施及办公场所的网络需求',
              '视频监控与统一运维平台：仅在项目范围包含安防和集中运维时进一步评估'
            ],
            fitScore: 56,
            scoreRationale: '铁路项目可能带来通信、网络和运维 ICT 配套机会，但当前记录没有提供已确认的 ICT 分包范围、技术规范、采购计划或业主需求。评分反映当前证据下的方案范围匹配度，不代表中标概率或项目金额。',
            risks: [
              '当前记录未附可核验的来源证据条目，具体 ICT 范围尚未确认。',
              '铁路信号、列控及安全关键系统涉及专门资质和系统责任边界，不应仅凭项目名称假设为华为可承接范围。',
              '采购包划分、主承包商、预算分配和招标时间均待核实。'
            ],
            nextActions: [
              '核实业主、项目顾问及主承包商，并获取正式 Scope/技术规范。',
              '确认通信承载、站点网络、视频监控和运维平台是否属于本项目或独立采购包。',
              '在确认采购范围后再调整匹配评分与优先级。'
            ],
            evidence: [],
            factsVsInference: '事实：现有 D1 记录将项目归类为伊拉克铁路项目，阶段为 Design；项目摘要描述 Mosul–Duhok–Zakho 铁路线路及相关土建/配套设施。推断：沿线通信、站点网络、视频监控或云资源可能形成 ICT 配套需求。以上 ICT 需求尚未由当前证据确认；未将其表述为已发布招标要求。'
          };

          const post = await fetch(endpoint, {
            method: 'POST',
            headers: { ...headers, 'content-type': 'application/json' },
            body: JSON.stringify({ updates: [{ opportunityId: id, analysis }] }),
            signal: AbortSignal.timeout(30000)
          });
          const saved = await post.json().catch(() => ({}));
          if (!post.ok || saved.saved !== 1 || saved.failed !== 0 || saved.results?.[0]?.saved !== true) {
            console.log('D1 write failed:', JSON.stringify({
              httpStatus: post.status, saved: saved.saved, failed: saved.failed,
              error: saved.results?.[0]?.error || saved.error || 'WRITE_FAILED'
            }));
            process.exit(1);
          }
          console.log('D1 write accepted: saved=1; project details suppressed.');

          const verifyResponse = await fetch(endpoint + '?priority=P0%2CP1%2CP2&limit=200', {
            headers, signal: AbortSignal.timeout(30000)
          });
          if (!verifyResponse.ok) throw new Error('Readback failed with HTTP ' + verifyResponse.status);
          const verify = await verifyResponse.json();
          const savedRow = (verify.opportunities || []).find(x => x.id === id);
          const readback = parseObject(savedRow?.solutionMatches).opportunityAnalysis;
          if (!readback || readback.promptVersion !== analysis.promptVersion ||
              readback.fitScore !== analysis.fitScore || readback.priority !== analysis.priority) {
            throw new Error('D1 readback validation failed.');
          }
          console.log(JSON.stringify({
            result: 'saved-and-readback-verified',
            opportunityId: id,
            promptVersion: readback.promptVersion,
            fitScore: readback.fitScore,
            priority: readback.priority,
            readbackVerified: true,
            auditActionExpected: 'opportunity.scope_fit_analysis_saved'
          }, null, 2));
          NODE
