name: MEED Batch Opportunity Analysis Writeback
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/meed-opportunity-analysis-batch.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meed-opportunity-analysis-batch
  cancel-in-progress: false

jobs:
  analyze-and-writeback:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Analyze production MEED opportunities and verify D1 readback
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: \${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: \${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MOONSHOT_API_KEY: \${{ secrets.MOONSHOT_API_KEY }}
          KIMI_API_KEY: \${{ secrets.KIMI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN; no records changed."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID; no records changed."; exit 1; }
          API_KEY="\${MOONSHOT_API_KEY:-\${KIMI_API_KEY:-}}"
          test -n "$API_KEY" || { echo "Missing MOONSHOT_API_KEY or KIMI_API_KEY; no records changed."; exit 1; }
          export API_KEY
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import { execFileSync } from 'node:child_process';

          const apiKey = process.env.API_KEY;
          const referenceId = 'MEED-IQ-20855';
          const promptVersion = 'meed-scope-fit-v1';
          const actorId = 'service:MTL Batch Opportunity Analysis';
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          const parseObject = value => {
            try {
              const parsed = typeof value === 'string' ? JSON.parse(value || '{}') : value;
              return parsed && typeof parsed === 'object' && !Array.isArray(parsed) ? parsed : {};
            } catch { return {}; }
          };
          function quote(value) {
            if (value === null || value === undefined) return 'NULL';
            if (typeof value === 'number' && Number.isFinite(value)) return String(value);
            return "'" + String(value).replace(/'/g, "''") + "'";
          }
          function wrangler(sql, label, asFile = false) {
            const args = ['wrangler', 'd1', 'execute', 'mssd_mtl_prod', '--remote', '--json'];
            let filePath;
            if (asFile) {
              filePath = path.join(os.tmpdir(), 'mtl-analysis-' + crypto.randomUUID() + '.sql');
              fs.writeFileSync(filePath, sql, { mode: 0o600 });
              args.push('--file=' + filePath);
            } else {
              args.push('--command', sql);
            }
            try {
              const output = execFileSync('npx', args, { encoding: 'utf8', env: process.env, maxBuffer: 50 * 1024 * 1024, timeout: 120000 });
              const starts = [output.indexOf('['), output.indexOf('{')].filter(index => index >= 0);
              if (!starts.length) throw new Error('No JSON output');
              const raw = output.slice(Math.min(...starts));
              let parsed;
              try { parsed = JSON.parse(raw); }
              catch {
                const lastArray = raw.lastIndexOf(']');
                const lastObject = raw.lastIndexOf('}');
                const end = Math.max(lastArray, lastObject);
                if (end < 0) throw new Error('Invalid JSON output');
                parsed = JSON.parse(raw.slice(0, end + 1));
              }
              if (Array.isArray(parsed)) {
                const failed = parsed.find(item => item.success === false || item.error);
                if (failed) throw new Error(JSON.stringify(failed.error || failed));
              } else if (parsed.success === false || parsed.error) throw new Error(JSON.stringify(parsed.error || parsed));
              return parsed;
            } catch (error) {
              throw new Error(label + ' failed: ' + String(error?.stderr || error?.message || error).slice(0, 900));
            } finally {
              if (filePath) try { fs.unlinkSync(filePath); } catch {}
            }
          }
          function rowsFrom(result) {
            if (Array.isArray(result)) {
              for (const item of result) if (Array.isArray(item?.results)) return item.results;
              for (const item of result) if (Array.isArray(item?.result?.results)) return item.result.results;
            }
            if (Array.isArray(result?.results)) return result.results;
            if (Array.isArray(result?.result?.results)) return result.result.results;
            return [];
          }
          const query = "SELECT id, external_id AS externalId, title, title_en AS titleEn, country, city, industry, stage, priority, score, confidence, project_value AS projectValue, addressable_value AS addressableValue, currency, funding_status AS fundingStatus, bid_deadline AS bidDeadline, summary, key_project_milestones AS keyProjectMilestones, news_and_updates AS newsAndUpdates, latest_news AS latestNews, solution_matches AS solutionMatches, source_name AS sourceName, source_url AS sourceUrl, updated_at AS updatedAt FROM opportunities WHERE priority IN ('P0','P1','P2') AND (source_name LIKE '%MEED%' OR id LIKE 'MEED-%') ORDER BY CASE priority WHEN 'P0' THEN 0 WHEN 'P1' THEN 1 ELSE 2 END, score DESC, updated_at DESC LIMIT 200";
          const rows = rowsFrom(wrangler(query, 'Read MEED opportunities'));
          const opportunities = rows.filter(row => String(row.id) !== referenceId);
          console.log(JSON.stringify({ step: 'read', totalReturned: rows.length, referencePreserved: rows.some(row => String(row.id) === referenceId), queuedForAnalysis: opportunities.length }));
          if (!opportunities.length) {
            console.log('No non-reference MEED opportunities returned; no writes required.');
            process.exit(0);
          }
          const evidenceRows = rowsFrom(wrangler("SELECT e.opportunity_id AS opportunityId, e.kind, e.excerpt, e.source_url AS sourceUrl, e.collected_at AS collectedAt FROM evidence e INNER JOIN opportunities o ON o.id = e.opportunity_id WHERE (o.source_name LIKE '%MEED%' OR o.id LIKE 'MEED-%') ORDER BY e.collected_at DESC LIMIT 5000", 'Read MEED evidence'));
          const evidenceById = new Map();
          for (const item of evidenceRows) {
            const id = String(item.opportunityId);
            const list = evidenceById.get(id) || [];
            if (list.length < 8) list.push(item);
            evidenceById.set(id, list);
          }
          const compact = opportunities.map(row => ({
            opportunityId: String(row.id),
            title: String(row.title || '').slice(0, 500),
            titleEn: String(row.titleEn || '').slice(0, 500),
            industry: String(row.industry || '').slice(0, 120),
            stage: String(row.stage || '').slice(0, 120),
            summary: String(row.summary || '').slice(0, 3000),
            keyProjectMilestones: String(row.keyProjectMilestones || '').slice(0, 1800),
            newsAndUpdates: String(row.newsAndUpdates || '').slice(0, 1800),
            latestNews: String(row.latestNews || '').slice(0, 1800),
            sourceUrl: String(row.sourceUrl || '').slice(0, 500),
            evidence: (evidenceById.get(String(row.id)) || []).map(item => ({
              kind: String(item.kind || '').slice(0, 100),
              excerpt: String(item.excerpt || '').slice(0, 900),
              sourceUrl: String(item.sourceUrl || '').slice(0, 500),
              collectedAt: String(item.collectedAt || '').slice(0, 80)
            }))
          }));
          const groups = [];
          for (let i = 0; i < compact.length; i += 3) groups.push(compact.slice(i, i + 3));
          const analyzed = new Map();
          const failures = [];
          let cursor = 0;
          const concurrency = Math.min(3, groups.length);
          async function analyzeGroup(group, index) {
            const prompt = [
              '你是华为伊拉克业务的企业ICT解决方案架构师与项目情报分析师。',
              '参考样板项目：MoT, Iraq — The Development Road (Railway): Mosul–Duhok–Zakho Line（MEED-IQ-20855）。样板原则：区分事实与推断；ICT需求只有在来源证据支持时才能称为已确认；铁路信号、列控等安全关键系统不能仅凭项目名称认定为华为可承接范围。',
              '对每个机会分别独立分析，不能复制样板的方案、分数或风险。仅根据标题、摘要、阶段、里程碑、新闻和 evidence 判断。行业本身不是方案匹配的充分依据。证据不足时降低评分并明确待核实事项，不得编造金额、业主要求、招标状态、联系人、技术范围或来源。',
              '优先给出1至4项与具体工作包匹配的华为ICT方案；证据不足时允许输出“暂不推荐具体方案/待确认ICT范围”，不要为了凑数推荐。不同领域项目不能一律匹配相同方案。',
              'fitScore是当前证据下的项目范围与华为ICT方案匹配度，不是中标概率或项目金额。priority按fitScore确定：85-100为P0，70-84为P1，0-69为P2。',
              '输出中文且简洁具体。risks和nextActions各2至5条；recommendedHuaweiSolutions为1至4条或空数组；evidence仅引用输入中的来源证据，若没有可核验证据则空数组。factsVsInference须明确区分事实、推断与证据缺口。',
              '仅返回JSON对象：{"analyses":[{"opportunityId":"原样ID","priority":"P0|P1|P2","demandSummary":"...","recommendedHuaweiSolutions":["..."],"fitScore":0,"scoreRationale":"...","risks":["..."],"nextActions":["..."],"evidence":["..."],"factsVsInference":"..."}]}。每个输入ID恰好返回一次。',
              '待分析机会：',
              JSON.stringify(group)
            ].join('\n\n');
            const requestBody = {
              model: 'kimi-k2.6',
              temperature: 1,
              max_tokens: 7000,
              messages: [
                { role: 'system', content: '严格遵守输入证据，不得虚构事实。只返回JSON。' },
                { role: 'user', content: prompt }
              ]
            };
            let response;
            let lastError;
            for (let attempt = 1; attempt <= 3; attempt++) {
              try {
                response = await fetch('https://api.moonshot.cn/v1/chat/completions', {
                  method: 'POST',
                  headers: { Authorization: 'Bearer ' + apiKey, 'Content-Type': 'application/json' },
                  body: JSON.stringify(requestBody),
                  signal: AbortSignal.timeout(60000)
                });
                if (response.ok) break;
                lastError = new Error('Kimi HTTP ' + response.status + ' for group ' + (index + 1));
                if (response.status < 500 && response.status !== 429) break;
              } catch (error) { lastError = error; }
              await sleep(attempt * 1500);
            }
            if (!response || !response.ok) throw lastError || new Error('Kimi request failed for group ' + (index + 1));
            const result = await response.json();
            const text = result.choices?.[0]?.message?.content;
            if (!text) throw new Error('Empty Kimi response for group ' + (index + 1));
            const start = text.indexOf('{');
            const end = text.lastIndexOf('}');
            if (start < 0 || end <= start) throw new Error('Invalid JSON response for group ' + (index + 1));
            const parsed = JSON.parse(text.slice(start, end + 1));
            if (!Array.isArray(parsed.analyses)) throw new Error('Missing analyses array for group ' + (index + 1));
            const expected = new Set(group.map(item => item.opportunityId));
            for (const item of parsed.analyses) {
              const id = String(item.opportunityId || '');
              if (!expected.has(id) || analyzed.has(id)) throw new Error('Unexpected or duplicate ID in group ' + (index + 1));
              if (!Number.isInteger(item.fitScore) || item.fitScore < 0 || item.fitScore > 100) throw new Error('Invalid fitScore in group ' + (index + 1));
              if (!['P0', 'P1', 'P2'].includes(item.priority)) throw new Error('Invalid priority in group ' + (index + 1));
              if (!String(item.demandSummary || '').trim() || !String(item.scoreRationale || '').trim()) throw new Error('Required analysis text missing in group ' + (index + 1));
              for (const field of ['recommendedHuaweiSolutions', 'risks', 'nextActions', 'evidence']) {
                if (!Array.isArray(item[field])) throw new Error('Invalid ' + field + ' in group ' + (index + 1));
              }
              analyzed.set(id, {
                promptVersion,
                analyzedAt: new Date().toISOString(),
                priority: item.priority,
                demandSummary: String(item.demandSummary).slice(0, 2200),
                recommendedHuaweiSolutions: item.recommendedHuaweiSolutions.map(String).slice(0, 4).map(value => value.slice(0, 500)),
                fitScore: item.fitScore,
                scoreRationale: String(item.scoreRationale).slice(0, 2200),
                risks: item.risks.map(String).slice(0, 6).map(value => value.slice(0, 700)),
                nextActions: item.nextActions.map(String).slice(0, 6).map(value => value.slice(0, 700)),
                evidence: item.evidence.map(String).slice(0, 8).map(value => value.slice(0, 700)),
                factsVsInference: String(item.factsVsInference || '事实与推断需进一步核实。').slice(0, 2200)
              });
            }
            if (parsed.analyses.length !== group.length) throw new Error('Incomplete model output for group ' + (index + 1));
          }
          await Promise.all(Array.from({ length: concurrency }, async () => {
            while (cursor < groups.length) {
              const index = cursor++;
              try {
                await analyzeGroup(groups[index], index);
                console.log(JSON.stringify({ step: 'analysis', group: index + 1, groups: groups.length, analyzed: analyzed.size }));
              } catch (error) {
                failures.push({ group: index + 1, error: String(error?.message || error).slice(0, 250) });
              }
            }
          }));
          if (failures.length || analyzed.size !== compact.length) {
            console.error(JSON.stringify({ step: 'analysis-failed', failedGroups: failures, analyzedCount: analyzed.size, expectedCount: compact.length }));
            throw new Error('Analysis incomplete; refusing D1 writeback.');
          }

          const updates = Array.from(analyzed, ([opportunityId, analysis]) => ({ opportunityId, analysis }));
          let savedCount = 0;
          const writeNow = Date.now();
          for (let i = 0; i < updates.length; i += 25) {
            const chunk = updates.slice(i, i + 25);
            const statements = [];
            for (const item of chunk) {
              const original = rows.find(row => String(row.id) === item.opportunityId);
              const previous = parseObject(original?.solutionMatches);
              const merged = {
                ...previous,
                opportunityAnalysis: {
                  ...item.analysis,
                  analyzedBy: actorId,
                  source: 'ChatGPT-assisted manual analysis',
                  scoreMeaning: 'Scope-to-Huawei-solution fit; not win probability or project value'
                }
              };
              statements.push('UPDATE opportunities SET solution_matches = ' + quote(JSON.stringify(merged)) + ', updated_at = ' + writeNow + ' WHERE id = ' + quote(item.opportunityId) + ';');
              const metadata = JSON.stringify({
                promptVersion,
                fitScore: item.analysis.fitScore,
                analyzedAt: item.analysis.analyzedAt,
                previousValuePreserved: Boolean(original?.solutionMatches)
              });
              statements.push('INSERT INTO audit_logs (id, actor_id, action, entity_type, entity_id, metadata, created_at) VALUES (' +
                [crypto.randomUUID(), actorId, 'opportunity.scope_fit_analysis_saved', 'opportunity', item.opportunityId, metadata, writeNow].map(quote).join(', ') + ');');
            }
            wrangler(statements.join('\n'), 'Write analysis and audit chunk ' + (Math.floor(i / 25) + 1), true);
            savedCount += chunk.length;
            console.log(JSON.stringify({ step: 'writeback', chunk: Math.floor(i / 25) + 1, saved: chunk.length, totalSaved: savedCount }));
          }
          const ids = updates.map(item => item.opportunityId);
          const verifySql = 'SELECT id, solution_matches AS solutionMatches FROM opportunities WHERE id IN (' + ids.map(quote).join(',') + ')';
          const verifiedRows = rowsFrom(wrangler(verifySql, 'Readback verification'));
          const verified = new Map(verifiedRows.map(row => [String(row.id), row]));
          const mismatches = [];
          for (const [id, expected] of analyzed) {
            const actual = parseObject(parseObject(verified.get(id)?.solutionMatches).opportunityAnalysis);
            if (actual.promptVersion !== promptVersion || actual.fitScore !== expected.fitScore || actual.priority !== expected.priority || !actual.analyzedAt) mismatches.push(id);
          }
          if (mismatches.length) {
            console.error(JSON.stringify({ step: 'readback-failed', count: mismatches.length, ids: mismatches.slice(0, 20) }));
            throw new Error('D1 readback verification failed.');
          }
          console.log(JSON.stringify({
            result: 'batch-saved-and-readback-verified',
            promptVersion,
            referenceOpportunityPreserved: true,
            analyzed: analyzed.size,
            saved: savedCount,
            failed: 0,
            readbackVerified: analyzed.size,
            auditAction: 'opportunity.scope_fit_analysis_saved'
          }, null, 2));
          NODE