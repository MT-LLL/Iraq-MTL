name: MEED Batch Opportunity Analysis Writeback
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/meed-opportunity-analysis-batch.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meed-opportunity-analysis-batch
  cancel-in-progress: false

jobs:
  analyze-and-writeback:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Analyze production MEED opportunities and verify D1 readback
        shell: bash
        env:
          CF_ACCESS_CLIENT_ID: \${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: \${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          MOONSHOT_API_KEY: \${{ secrets.MOONSHOT_API_KEY }}
          KIMI_API_KEY: \${{ secrets.KIMI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$CF_ACCESS_CLIENT_ID"
          test -n "$CF_ACCESS_CLIENT_SECRET"
          API_KEY="\${MOONSHOT_API_KEY:-\${KIMI_API_KEY:-}}"
          test -n "$API_KEY" || { echo "Missing MOONSHOT_API_KEY or KIMI_API_KEY secret; no records changed."; exit 1; }
          export API_KEY
          node --input-type=module <<'NODE'
          const base = 'https://iraq-mtl.lihui9329.workers.dev/api/admin-opportunity-analysis';
          const accessHeaders = {
            'CF-Access-Client-Id': process.env.CF_ACCESS_CLIENT_ID,
            'CF-Access-Client-Secret': process.env.CF_ACCESS_CLIENT_SECRET
          };
          const apiKey = process.env.API_KEY;
          const referenceId = 'MEED-IQ-20855';
          const promptVersion = 'meed-scope-fit-v1';
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          const parseObject = value => {
            try {
              const parsed = typeof value === 'string' ? JSON.parse(value || '{}') : value;
              return parsed && typeof parsed === 'object' && !Array.isArray(parsed) ? parsed : {};
            } catch { return {}; }
          };
          async function fetchJson(url, options, label) {
            let last;
            for (let attempt = 1; attempt <= 3; attempt++) {
              try {
                const response = await fetch(url, { ...options, redirect: 'manual', signal: AbortSignal.timeout(60000) });
                const contentType = response.headers.get('content-type') || '';
                if (response.ok) {
                  const raw = await response.text();
                  try { return JSON.parse(raw); }
                  catch { throw new Error(label + ' returned non-JSON HTTP ' + response.status + ' content-type=' + contentType + ' body-prefix=' + raw.slice(0, 80).replace(/\\s+/g, ' ')); }
                }
                const location = response.headers.get('location') || '';
                last = new Error(label + ' HTTP ' + response.status + (location ? ' redirect=' + location.slice(0, 180) : ''));
                if (response.status < 500 && response.status !== 429) break;
              } catch (error) { last = error; }
              await sleep(attempt * 1500);
            }
            throw new Error(label + ' failed after retries: ' + String(last?.message || last));
          }
          const data = await fetchJson(base + '?priority=P0%2CP1%2CP2&limit=200', { headers: accessHeaders }, 'Production D1 read');
          if (!Array.isArray(data.opportunities)) throw new Error('Production D1 response has no opportunity list');
          const opportunities = data.opportunities.filter(row => String(row.id) !== referenceId);
          console.log(JSON.stringify({ step: 'read', source: data.source, totalReturned: data.opportunities.length, referencePreserved: data.opportunities.some(row => String(row.id) === referenceId), queuedForAnalysis: opportunities.length }));
          if (!opportunities.length) {
            console.log('No non-reference MEED opportunities returned; no writes required.');
            process.exit(0);
          }

          const compact = opportunities.map(row => ({
            opportunityId: String(row.id),
            title: String(row.title || '').slice(0, 500),
            titleEn: String(row.titleEn || '').slice(0, 500),
            industry: String(row.industry || '').slice(0, 120),
            stage: String(row.stage || '').slice(0, 120),
            summary: String(row.summary || '').slice(0, 3000),
            keyProjectMilestones: String(row.keyProjectMilestones || '').slice(0, 1800),
            newsAndUpdates: String(row.newsAndUpdates || '').slice(0, 1800),
            latestNews: String(row.latestNews || '').slice(0, 1800),
            sourceUrl: String(row.sourceUrl || '').slice(0, 500),
            existingAnalysis: parseObject(row.solutionMatches).opportunityAnalysis ? 'present' : 'absent',
            evidence: (Array.isArray(row.evidence) ? row.evidence : []).slice(0, 8).map(item => ({
              kind: String(item.kind || '').slice(0, 100),
              excerpt: String(item.excerpt || '').slice(0, 900),
              sourceUrl: String(item.sourceUrl || '').slice(0, 500),
              collectedAt: String(item.collectedAt || '').slice(0, 80)
            }))
          }));

          const groups = [];
          for (let i = 0; i < compact.length; i += 3) groups.push(compact.slice(i, i + 3));
          const analyzed = new Map();
          const failures = [];
          let cursor = 0;
          const concurrency = Math.min(3, groups.length);
          async function analyzeGroup(group, index) {
            const prompt = [
              '你是华为伊拉克业务的企业ICT解决方案架构师与项目情报分析师。',
              '参考样板项目：MoT, Iraq — The Development Road (Railway): Mosul–Duhok–Zakho Line（MEED-IQ-20855）。样板的判断原则是：先区分已知事实和推断；ICT需求只有在来源证据支持时才能称为已确认；铁路信号、列控等安全关键系统不能仅凭项目名称认定为华为可承接范围。',
              '请对输入的每个机会分别独立分析，不能复制样板的方案、分数或风险。只根据每条记录的标题、摘要、阶段、里程碑、新闻和 evidence 做判断。行业本身不能作为方案匹配的充分依据。证据不足时降低评分，明确待核实事项，不能编造项目金额、业主要求、招标状态、联系人、技术范围或来源。',
              '优先给出1至4项与具体工作包匹配的华为ICT方案；若证据不足，允许给出“暂不推荐具体方案/待确认ICT范围”，不要为了凑数而推荐。不要把铁路、道路、油气、电力、医疗等行业项目一律匹配相同方案。',
              'fitScore是当前证据下的“项目范围与华为ICT方案匹配度”，不是中标概率、项目成功概率或项目金额。priority按fitScore确定：85-100为P0，70-84为P1，0-69为P2。',
              '输出必须是中文，简洁、具体、适合机会详情页展示。risks和nextActions各输出2至5条；recommendedHuaweiSolutions输出1至4条或空数组；evidence仅引用输入中的证据摘要/原文，若没有可核验的证据则输出空数组。factsVsInference中明确列出事实和推断，并注明证据缺口。',
              '仅返回有效JSON对象，格式为 {"analyses":[{"opportunityId":"原样ID","priority":"P0|P1|P2","demandSummary":"...","recommendedHuaweiSolutions":["..."],"fitScore":0,"scoreRationale":"...","risks":["..."],"nextActions":["..."],"evidence":["..."],"factsVsInference":"..."}]}。每个输入ID必须恰好返回一次，不要增加或遗漏ID。',
              '待分析机会：',
              JSON.stringify(group)
            ].join('\n\n');
            const payload = {
              model: 'kimi-k2.6',
              temperature: 1,
              max_tokens: 7000,
              messages: [
                { role: 'system', content: '严格遵守输入证据，不得虚构事实。只返回JSON。' },
                { role: 'user', content: prompt }
              ]
            };
            const response = await fetchJson('https://api.moonshot.cn/v1/chat/completions', {
              method: 'POST',
              headers: { Authorization: 'Bearer ' + apiKey, 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            }, 'Kimi analysis group ' + (index + 1));
            const text = response.choices?.[0]?.message?.content;
            if (!text) throw new Error('Empty Kimi response for group ' + (index + 1));
            const start = text.indexOf('{');
            const end = text.lastIndexOf('}');
            if (start < 0 || end <= start) throw new Error('Invalid JSON response for group ' + (index + 1));
            const parsed = JSON.parse(text.slice(start, end + 1));
            if (!Array.isArray(parsed.analyses)) throw new Error('Missing analyses array for group ' + (index + 1));
            const expected = new Set(group.map(item => item.opportunityId));
            for (const item of parsed.analyses) {
              const id = String(item.opportunityId || '');
              if (!expected.has(id) || analyzed.has(id)) throw new Error('Unexpected or duplicate ID in model output for group ' + (index + 1));
              if (!Number.isInteger(item.fitScore) || item.fitScore < 0 || item.fitScore > 100) throw new Error('Invalid fitScore for an opportunity in group ' + (index + 1));
              if (!['P0', 'P1', 'P2'].includes(item.priority)) throw new Error('Invalid priority in group ' + (index + 1));
              if (!String(item.demandSummary || '').trim() || !String(item.scoreRationale || '').trim()) throw new Error('Required analysis text missing in group ' + (index + 1));
              for (const field of ['recommendedHuaweiSolutions', 'risks', 'nextActions', 'evidence']) {
                if (!Array.isArray(item[field])) throw new Error('Invalid ' + field + ' in group ' + (index + 1));
              }
              analyzed.set(id, {
                promptVersion,
                analyzedAt: new Date().toISOString(),
                priority: item.priority,
                demandSummary: String(item.demandSummary).slice(0, 2200),
                recommendedHuaweiSolutions: item.recommendedHuaweiSolutions.map(String).slice(0, 4).map(value => value.slice(0, 500)),
                fitScore: item.fitScore,
                scoreRationale: String(item.scoreRationale).slice(0, 2200),
                risks: item.risks.map(String).slice(0, 6).map(value => value.slice(0, 700)),
                nextActions: item.nextActions.map(String).slice(0, 6).map(value => value.slice(0, 700)),
                evidence: item.evidence.map(String).slice(0, 8).map(value => value.slice(0, 700)),
                factsVsInference: String(item.factsVsInference || '事实与推断需进一步核实。').slice(0, 2200)
              });
            }
            if (parsed.analyses.length !== group.length) throw new Error('Model returned incomplete group ' + (index + 1));
          }
          await Promise.all(Array.from({ length: concurrency }, async () => {
            while (cursor < groups.length) {
              const index = cursor++;
              try {
                await analyzeGroup(groups[index], index);
                console.log(JSON.stringify({ step: 'analysis', group: index + 1, groups: groups.length, analyzed: analyzed.size }));
              } catch (error) {
                failures.push({ group: index + 1, error: String(error?.message || error).slice(0, 300) });
              }
            }
          }));
          if (failures.length) {
            console.error(JSON.stringify({ step: 'analysis-failed', failedGroups: failures, analyzedCount: analyzed.size, expectedCount: compact.length }));
            throw new Error('Analysis incomplete; refusing partial D1 writeback.');
          }
          if (analyzed.size !== compact.length) throw new Error('Analysis count mismatch; refusing D1 writeback.');

          const updates = Array.from(analyzed, ([opportunityId, analysis]) => ({ opportunityId, analysis }));
          let savedCount = 0;
          for (let i = 0; i < updates.length; i += 25) {
            const chunk = updates.slice(i, i + 25);
            const result = await fetchJson(base, {
              method: 'POST',
              headers: { ...accessHeaders, 'content-type': 'application/json' },
              body: JSON.stringify({ updates: chunk })
            }, 'D1 writeback chunk ' + (Math.floor(i / 25) + 1));
            if (result.saved !== chunk.length || result.failed !== 0 || !Array.isArray(result.results) || result.results.some(row => row.saved !== true)) {
              console.error(JSON.stringify({ step: 'write-failed', chunk: Math.floor(i / 25) + 1, expected: chunk.length, saved: result.saved, failed: result.failed }));
              throw new Error('D1 writeback chunk was incomplete; inspect the endpoint audit log.');
            }
            savedCount += result.saved;
            console.log(JSON.stringify({ step: 'writeback', chunk: Math.floor(i / 25) + 1, saved: result.saved, totalSaved: savedCount }));
          }

          const verify = await fetchJson(base + '?priority=P0%2CP1%2CP2&limit=200', { headers: accessHeaders }, 'D1 readback');
          const byId = new Map((verify.opportunities || []).map(row => [String(row.id), row]));
          const mismatches = [];
          for (const [id, expected] of analyzed) {
            const row = byId.get(id);
            const actual = parseObject(row?.solutionMatches).opportunityAnalysis;
            if (!actual || actual.promptVersion !== promptVersion || actual.fitScore !== expected.fitScore || actual.priority !== expected.priority || !actual.analyzedAt) {
              mismatches.push(id);
            }
          }
          if (mismatches.length) {
            console.error(JSON.stringify({ step: 'readback-failed', count: mismatches.length, ids: mismatches.slice(0, 20) }));
            throw new Error('D1 readback verification failed.');
          }
          console.log(JSON.stringify({
            result: 'batch-saved-and-readback-verified',
            promptVersion,
            referenceOpportunityPreserved: true,
            analyzed: analyzed.size,
            saved: savedCount,
            failed: 0,
            readbackVerified: analyzed.size,
            auditActionExpected: 'opportunity.scope_fit_analysis_saved'
          }, null, 2));
          NODE