name: ChatGPT Manual Opportunity Analysis (No Model API)
on:
  workflow_dispatch:
    inputs:
      note:
        description: "This workflow is intentionally non-executing. Start analysis by asking ChatGPT in the project conversation."
        required: false
        type: string

permissions:
  contents: read

jobs:
  explain-manual-process:
    runs-on: ubuntu-latest
    steps:
      - name: Explain the supported execution path
        run: |
          echo "No AI/model API is called by this workflow."
          echo "No opportunity records are read or modified."
          echo "To analyze opportunities, ask ChatGPT in the Iraq-MTL project conversation to execute the manual 30-record analysis workflow."
          echo "The active ChatGPT model performs the analysis in the conversation; D1 writeback is performed only through the site's authenticated admin writeback path when available."
