name: Verify Admin Analysis Service Caller
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/admin-opportunity-analysis-service-check.yml"
      - "app/api/admin-opportunity-analysis/route.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  service-token-check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production D1 read access without exposing records
        shell: bash
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CF_ACCESS_CLIENT_ID" || { echo "Missing CF_ACCESS_CLIENT_ID secret"; exit 1; }
          test -n "$CF_ACCESS_CLIENT_SECRET" || { echo "Missing CF_ACCESS_CLIENT_SECRET secret"; exit 1; }
          status="$(curl --silent --show-error --output response.json --write-out '%{http_code}' --max-time 20 \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            "https://iraq-mtl.lihui9329.workers.dev/api/admin-opportunity-analysis?priority=P0%2CP1%2CP2&limit=1")"
          echo "GET endpoint HTTP status: $status"
          [[ "$status" == "200" ]] || { echo "Production D1 read check failed; response body suppressed."; exit 1; }
          node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("response.json","utf8")); if(!x.ok || !Array.isArray(x.opportunities) || typeof x.count!=="number") process.exit(1); console.log(JSON.stringify({ok:x.ok,source:x.source,count:x.count,hasOpportunities:x.opportunities.length>0},null,2));'

      - name: Verify POST authorization with a guaranteed nonexistent test ID (no database writes)
        shell: bash
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          payload='{"updates":[{"opportunityId":"MEED-AUTH-CHECK-NONEXISTENT-20261029","analysis":{"promptVersion":"meed-scope-fit-v1","fitScore":0,"priority":"P2","demandSummary":"Authorization-only test; no project analysis.","scoreRationale":"Synthetic test payload; expected not to be saved.","recommendedHuaweiSolutions":[],"risks":[],"nextActions":[],"evidence":[]}}]}'
          status="$(curl --silent --show-error --output response.json --write-out '%{http_code}' --max-time 20 \
            -X POST \
            -H "Content-Type: application/json" \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            --data "$payload" \
            "https://iraq-mtl.lihui9329.workers.dev/api/admin-opportunity-analysis")"
          echo "POST authorization test HTTP status: $status"
          [[ "$status" == "200" ]] || { node -e 'const fs=require("fs");try{const x=JSON.parse(fs.readFileSync("response.json","utf8"));console.log("Safe error code:",x.error||"not-json")}catch{console.log("Response body suppressed.")}'; exit 1; }
          node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("response.json","utf8"));if(x.saved!==0||x.failed!==1||!Array.isArray(x.results)||x.results[0]?.error!=="MEED_OPPORTUNITY_NOT_FOUND"||x.results[0]?.saved!==false)process.exit(1);console.log("PASS: POST authorization reached the database lookup; synthetic ID was not found and no record was saved.");'
