name: Deploy Cloudflare Worker

on:
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - "components/**"
      - "db/**"
      - "drizzle/**"
      - "lib/**"
      - "public/**"
      - "*.json"
      - "*.toml"
      - "*.ts"
      - "*.tsx"
      - "package-lock.json"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify Cloudflare credentials are present
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          echo "Cloudflare credentials are present."

      - name: Verify D1 schema
        run: |
          npx wrangler d1 execute mssd_mtl_prod --remote --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('users','opportunities','audit_logs','evidence','push_jobs','saved_views','lead_distributions','source_scan_runs') ORDER BY name;"

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deployment verification marker
        run: echo "Cloudflare Worker deployment completed."
