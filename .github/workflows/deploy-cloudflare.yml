name: Deploy Cloudflare Worker

on:
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - "components/**"
      - "db/**"
      - "drizzle/**"
      - "lib/**"
      - "public/**"
      - "scripts/**"
      - "*.json"
      - "*.toml"
      - "*.ts"
      - "*.tsx"
      - "package-lock.json"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify Cloudflare credentials are present
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          echo "Cloudflare credentials are present."

      - name: Apply opportunity tracking migration
        run: npx wrangler d1 execute mssd_mtl_prod --file=drizzle/0005_opportunity_tracking.sql --remote

      - name: Apply MEED contact migration
        run: npx wrangler d1 execute mssd_mtl_prod --file=drizzle/0006_opportunity_contacts.sql --remote

      - name: Apply MEED project intelligence migration
        shell: bash
        run: |
          if npx wrangler d1 execute mssd_mtl_prod --remote --command "PRAGMA table_info(opportunities);" | grep -q "key_project_milestones"; then
            echo "MEED project intelligence columns already exist."
          else
            npx wrangler d1 execute mssd_mtl_prod --file=drizzle/0007_meed_project_intelligence.sql --remote
          fi

      - name: Apply AI solution matching migration
        shell: bash
        run: |
          if npx wrangler d1 execute mssd_mtl_prod --remote --command "PRAGMA table_info(opportunities);" | grep -q "solution_matches"; then
            echo "AI solution matching column already exists."
          else
            npx wrangler d1 execute mssd_mtl_prod --file=drizzle/0008_ai_solution_matches.sql --remote
          fi

      - name: Verify D1 schema
        run: |
          npx wrangler d1 execute mssd_mtl_prod --remote --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('users','opportunities','audit_logs','evidence','push_jobs','saved_views','lead_distributions','source_scan_runs','opportunity_tracking','opportunity_contacts') ORDER BY name;"
          npx wrangler d1 execute mssd_mtl_prod --remote --command "PRAGMA table_info(opportunities);"

      - name: Deploy to Cloudflare Workers
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: |
          if [ -n "$RESEND_FROM_EMAIL" ] || [ -n "$MOONSHOT_API_KEY" ] || [ -n "$ZHIPU_API_KEY" ]; then
            node -e 'const fs=require("fs"); const keys=["RESEND_FROM_EMAIL","MOONSHOT_API_KEY","ZHIPU_API_KEY"]; const secrets=Object.fromEntries(keys.map(k=>[k,process.env[k]]).filter(([,v])=>v)); fs.writeFileSync("/tmp/worker-secrets.json", JSON.stringify(secrets), { mode: 0o600 })'
            npx wrangler deploy --config wrangler.toml --secrets-file /tmp/worker-secrets.json
            rm -f /tmp/worker-secrets.json
            echo "Worker deployed with configured sender and AI provider secrets; unset secrets are left untouched."
          else
            echo "::warning::No optional Worker secrets were supplied by GitHub Actions; existing Worker secrets are not intentionally modified."
            npx wrangler deploy --config wrangler.toml
          fi

      - name: Deployment verification marker
        run: echo "Cloudflare Worker deployment completed."
