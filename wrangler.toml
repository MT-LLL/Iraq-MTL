name = "mssd-mtl"
main = "dist/server/index.js"
compatibility_date = "2026-05-15"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "dist/client"
binding = "ASSETS"

[observability]
enabled = true

[triggers]
crons = ["0 4 * * 1"]

[vars]
MSSD_SITE_URL = "https://iraq-mtl.lihui9329.workers.dev/"
ZHIPU_MODEL = "glm-5.3"
ZHIPU_API_BASE_URL = "https://open.bigmodel.cn/api/paas/v4"
CF_ACCESS_TEAM_DOMAIN = "mssd-mtl.cloudflareaccess.com"
CF_ACCESS_AUD = "f580f01d138"

[[d1_databases]]
binding = "DB"
database_name = "mssd_mtl_prod"
database_id = "8def12cd-f8fd-4578-9e88-5e5e80c92a0c"
